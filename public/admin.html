<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>SAMSON Photo Report — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2f5f8; color: #212529; padding: 20px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.2rem; color: #003D79; margin-bottom: 16px; }
  .logout { float: right; font-size: .8rem; color: #6c757d; background: none; border: 0; cursor: pointer; text-decoration: underline; }
  .card { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 18px; margin-bottom: 16px; }
  h2 { font-size: .95rem; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
  th { color: #6c757d; font-weight: 600; }
  .row input, .row select { padding: 7px; border: 1px solid #ced4da; border-radius: 5px; margin-right: 6px; }
  .btn { padding: 7px 12px; border: 0; border-radius: 5px; cursor: pointer; font-size: .8rem; }
  .btn-primary { background: #003D79; color: #fff; }
  .btn-danger { background: #dc3545; color: #fff; margin-left: 4px; }
  .msg { font-size: .85rem; min-height: 1.2em; }
  .msg.ok { color: #198754; }
  .msg.err { color: #dc3545; }
  code { background: #f1f3f5; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SAMSON Photo Report — User Management <button class="logout" id="logoutBtn">Log out</button></h1>
  <div class="card">
    <h2>Users</h2>
    <table id="usersTbl">
      <thead><tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
  <div class="card">
    <h2>Add User</h2>
    <div class="row">
      <input id="nu_name" placeholder="username" />
      <input id="nu_pass" type="password" placeholder="password (min 6 chars)" />
      <select id="nu_role"><option value="user">user</option><option value="admin">admin</option></select>
      <button class="btn btn-primary" id="addBtn">Add</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <p style="font-size:.8rem;color:#6c757d">Deleting a user is permanent. Admins can create user accounts for colleagues or reset passwords via the change buttons.</p>
</div>
<script>
async function api(url, opts) {
  const res = await fetch(url, opts);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) ? data.error : ('HTTP ' + res.status));
  return data;
}
function msg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err');
}
function esc(s) { return String(s).replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
async function loadUsers() {
  try {
    const me = await api('/api/me');
    if (!me.admin) { document.body.innerHTML = '<p style="padding:40px">Forbidden: admin access required.</p>'; return; }
    const data = await api('/api/admin/users');
    const body = document.getElementById('usersBody');
    body.innerHTML = data.users.map(u => `<tr><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${esc((u.createdAt||'').slice(0,10))}</td><td><button class="btn btn-primary" data-u="${esc(u.username)}" onclick="resetPw('${esc(u.username)}')">Reset password</button><button class="btn btn-danger" data-u="${esc(u.username)}" onclick="delUser('${esc(u.username)}')">Delete</button></td></tr>`).join('');
  } catch (e) { msg(String(e), false); }
}
async function resetPw(username) {
  const pw = prompt('New password for ' + username + ' (min 6 chars):');
  if (!pw) return;
  try { await api('/api/admin/users/' + encodeURIComponent(username), { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }) }); msg('Password updated.', true); } catch (e) { msg(String(e), false); }
}
async function delUser(username) {
  if (!confirm('Delete user ' + username + '?')) return;
  try { await api('/api/admin/users/' + encodeURIComponent(username), { method: 'DELETE' }); msg('User deleted.', true); loadUsers(); } catch (e) { msg(String(e), false); }
}
document.getElementById('addBtn').onclick = async function() {
  const username = document.getElementById('nu_name').value.trim();
  const password = document.getElementById('nu_pass').value;
  const role = document.getElementById('nu_role').value;
  if (!username || !password) { msg('Username and password required.', false); return; }
  try { await api('/api/admin/users', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, password, role }) }); msg('User added.', true); document.getElementById('nu_name').value=''; document.getElementById('nu_pass').value=''; loadUsers(); } catch (e) { msg(String(e), false); }
};
document.getElementById('logoutBtn').onclick = async function() { try { await fetch('/api/logout', { method: 'POST' }); } catch(e) {} location.href = '/login'; };
loadUsers();
</script>
</body>
</html>
