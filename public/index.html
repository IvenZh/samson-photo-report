<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#003D79" />
  <title>SAMSON Photo Report — Q-2047</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23003D79'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-family='sans-serif'>S</text></svg>" />
</head>
<body ontouchstart="">

  <!-- Recovery banner -->
  <div id="recoverBanner" style="display:none;">
    <span></span>
    <div class="recover-actions">
      <button id="recoverYes" class="btn btn-sm btn-primary"></button>
      <button id="recoverNo" class="btn btn-sm btn-ghost"></button>
    </div>
  </div>

  <!-- Header -->
  <header id="appHeader">
    <div class="header-top">
      <div class="header-titles">
        <h1 id="appTitle">SAMSON Control Valve Photo Documentation</h1>
        <p id="appSubtitle">Q-2047 Photo Report System</p>
      </div>
      <div class="header-actions">
        <button id="btnRoleSwitch" class="btn-lang">Liu Yang · Operator</button>
        <button id="btnCompletedReports" class="btn-lang">Completed 0</button>
        <button id="langToggle" class="btn-lang">English</button>
      </div>
    </div>
    <nav id="stepIndicators" class="step-indicators"></nav>
    <div id="sessionToolbar" class="session-toolbar">
      <button id="btnRefreshCurrent" class="session-tool">刷新</button>
      <button id="btnResetSession" class="session-tool danger">重置</button>
      <button id="btnCloseSession" class="session-tool">关闭</button>
    </div>
  </header>

  <!-- Main content -->
  <main id="mainContent"></main>

  <!-- Footer navigation -->
  <footer id="stepFooter"></footer>
  <div id="sessionProgressBadge" class="session-progress-badge"></div>

  <!-- ── Camera Modal ── -->
  <div id="cameraModal" class="modal" style="display:none;">
    <div class="modal-content modal-cam">
      <h3><span id="camOrientation"></span></h3>
      <p class="cam-hint"></p>
      <div class="cam-buttons">
        <button id="btnTakePhoto" class="btn btn-primary">📷 <span class="cam-btn-label"></span></button>
        <button id="btnFromGallery" class="btn btn-outline">🖼️ <span class="gal-btn-label"></span></button>
        <button id="cancelCapture" class="btn btn-ghost"></button>
      </div>
    </div>
  </div>

  <!-- ── Cropper Modal ── -->
  <div id="cropperModal" class="modal" style="display:none;">
    <div class="modal-content modal-crop">
      <h3 id="cropTitle"></h3>
      <div class="crop-canvas-wrap">
        <canvas id="cropCanvas" touch-action="none"></canvas>
      </div>
      <div class="crop-buttons">
        <button id="doneCrop" class="btn btn-primary"></button>
        <button id="cancelCropBtn" class="btn btn-ghost"></button>
      </div>
    </div>
  </div>

  <!-- ── Scanner Modal ── -->
  <div id="scannerModal" class="modal" style="display:none;">
    <div class="modal-content modal-scan">
      <h3></h3>
      <div id="scannerReader" class="scanner-reader"></div>
      <button id="cancelScan" class="btn btn-ghost"></button>
    </div>
  </div>

  <!-- Load libs -->
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/batch-store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
